<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>n00b-project</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #2b1e3a;
        overflow: hidden;
        /* Au toucher, un doigt qui glisse commande le jeu : la page ne défile pas, ne zoome pas, ne rebondit pas. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #help {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: #fff8ec;
        font: 12px monospace;
        text-shadow: 1px 1px 0 #2b1e3a;
        line-height: 1.5;
        pointer-events: none;
      }
      #notice {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        color: #fff8ec;
        font: 12px monospace;
        text-shadow: 1px 1px 0 #2b1e3a;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff8ec;
        font: 14px monospace;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="notice"></div>
    <div id="loading">Chargement de la ville…</div>
    <div id="help">
      Flèches, ZQSD ou WASD : se déplacer · Maj : courir · E / Entrée : monter, descendre · Espace : frein à main<br />
      1 à 9 : choisir (concession, garage, atelier), 0 : retour · N : jour / nuit · C : inclinaison de la caméra · P : taille des pixels
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
